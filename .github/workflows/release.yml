name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release input
        env:
          RELEASE_REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "releases must run from main, got $RELEASE_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a semantic version without the v prefix" >&2
            exit 1
          fi
          if ! grep -q "^## $VERSION - " CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Build release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version " - " { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "release notes are empty" >&2
            exit 1
          fi

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to $tagged_sha, not $GITHUB_SHA" >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          release_args=(
            --verify-tag
            --title "$tag"
            --notes-file release-notes.md
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$tag" "${release_args[@]}"
